name: Collect flight fares

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python fare ETL
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          FEED_URLS: ${{ secrets.FEED_URLS }}
        run: python scripts/collect.py
