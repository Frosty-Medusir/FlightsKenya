name: Collect flight fares

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel collector
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
        run: |
          test -n "$VERCEL_APP_URL"
          test -n "$COLLECTOR_SECRET"
          curl --fail-with-body --retry 3 --retry-delay 10 \
            -X POST "$VERCEL_APP_URL/api/collect" \
            -H "Authorization: Bearer $COLLECTOR_SECRET"
