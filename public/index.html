<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102c28">
    <meta name="description" content="Compare Kenyan domestic flight fares and get local deal alerts.">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
    <title>Flights Kenya</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Kenya Flight Watch home">
          <span class="brand-mark">K</span>
          <span>FLIGHT WATCH <small>KENYA</small></span>
        </a>
        <button id="enable-alerts" class="outline-button" type="button">Enable alerts</button>
      </header>
      <section class="intro">
        <p class="eyebrow">DOMESTIC FARES · ALL IN ONE PLACE</p>
        <h1>Find your next<br><em>good fare.</em></h1>
        <p class="lede">Compare flights from JKIA and Wilson. No booking fees, no noisy alerts.</p>
      </section>
      <section class="search-panel" aria-label="Choose a route">
        <label>FROM<select id="origin"></select></label>
        <span class="route-arrow" aria-hidden="true">→</span>
        <label>TO<select id="destination"></select></label>
        <button id="search" class="search-button" type="button">Show fares <span aria-hidden="true">↗</span></button>
      </section>
      <section class="results">
        <div class="section-heading">
          <div><p class="eyebrow">LIVE COMPARISON</p><h2 id="route-title">Choose a route</h2></div>
          <p id="median-label" class="median-label"></p>
        </div>
        <div id="status" class="status" role="status">Loading routes…</div>
        <div id="fare-list" class="fare-list"></div>
      </section>
      <footer><span>Built for better trips around Kenya.</span><span>Prices in KES · Data from configured feeds</span></footer>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
